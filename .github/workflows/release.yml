name: Release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  notes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          base="https://github.com/${REPO}/blob/${TAG}"
          {
            gh release view "$TAG" --repo "$REPO" --json body --jq .body
            printf '\n## Documents at %s\n\n' "$TAG"
            for doc in GOVERNANCE.md CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md; do
              printf -- "- [%s](%s/%s)\n" "$doc" "$base" "$doc"
            done
          } > notes.md
          gh release edit "$TAG" --repo "$REPO" --notes-file notes.md
